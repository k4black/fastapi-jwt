name: Test

on:
  push:
    branches: [ main ]
  pull_request:


jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          cache: 'pip' # caching pip dependencies
      - name: Install dependencies
        run: |
          python -m pip install -e .[test]
      - name: Run Ruff lint
        run: python -m ruff check fastapi_jwt tests
      - name: Check Ruff formatting
        run: python -m ruff format --check fastapi_jwt tests
      - name: Run ty
        run: ty check fastapi_jwt

  test-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip' # caching pip dependencies
      - name: Install dependencies
        run: |
          python -m pip install wheel
          python -m pip install -e .[test]
      - name: Test itself
        run: python -m pytest --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: true # optional (default = false)
          verbose: true # optional (default = false)
          token: ${{ secrets.CODECOV_TOKEN }} # required 

  build-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install build and documentation dependencies
        run: python -m pip install '.[docs]' build twine
      - name: Build and check distributions
        run: |
          python -m build
          python -m twine check dist/*
          python - <<'PY'
          from pathlib import Path
          from tarfile import open as open_tar
          from zipfile import ZipFile

          with ZipFile(next(Path('dist').glob('*.whl'))) as wheel:
              assert 'fastapi_jwt/py.typed' in wheel.namelist()
          with open_tar(next(Path('dist').glob('*.tar.gz'))) as sdist:
              assert any(name.endswith('/fastapi_jwt/py.typed') for name in sdist.getnames())
          PY
      - name: Build documentation
        run: python -m mkdocs build --config-file docs/mkdocs.yml
