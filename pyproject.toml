[build-system]
requires = ["setuptools>=84.2.1", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"


[project]
name = "fastapi-jwt"
description = "`FastAPI` extension for JTW Auth"
readme = "README.md"
license = "MIT"
authors = [
  {name = "Konstantin Chernyshev", email = "kdchernyshev@gmail.com"},
]
dynamic = ["version"]

requires-python = ">=3.11"
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed"
]

dependencies = [
    "fastapi >=0.162.2",
]


[project.urls]
homepage = "https://github.com/k4black/fastapi-jwt"
documentation = "https://k4black.github.io/fastapi-jwt/"


[project.optional-dependencies]
authlib = [
    "Authlib >=1.9.5,<2.0.0"
]
test = [
    "Authlib >=1.9.5,<2.0.0",
    "httpx2 >=2.16.0,<3.0.0",
    "pytest >=9.2.0,<10.0.0",
    "pytest-cov >=7.1.0,<8.0.0",
    "pytest-mock >=3.17.0,<4.0.0",
    "requests >=2.34.2,<3.0.0",
    "black ==26.10.1",
    "mypy >=2.4.1,<3.0.0",
    "flake8 >=7.5.0,<8.0.0",
    "ruff >=0.17.4,<1.0.0",
    "isort >=9.0.2,<10.0.0"
]
docs = [
    "mkdocs >=1.6.1,<2.0.0",
    "mkdocs-material >=9.8.1,<10.0.0",
    "MkAutoDoc >=0.2.0,<1.0.0",
    "lazydocs >=0.4.8,<1.0.0",
    "mkdocs-include-markdown-plugin >=7.3.1,<8.0.0",
    "mkdocs-awesome-pages-plugin >=2.10.1,<3.0.0",
    "mike >=2.2.0,<3.0.0"
]


[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.mypy]
ignore_missing_imports = true
no_incremental = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_subclassing_any = false
disallow_any_generics = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
allow_untyped_decorators = true


[tool.pytest.ini_options]
minversion = "9.2"
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--cov=fastapi_jwt/ --cov-report term-missing"


# TODO: remove in favor of ruff "I" ruleset
[tool.isort]
profile = "black"
src_paths = ["fastapi-jwt", "tests"]
known_first_party = ["fastapi_jwt", "tests"]
line_length = 120
combine_as_imports = true


[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

fixable = ["ALL"]  # Allow fix for all enabled rules (when `--fix`) is provided.
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
